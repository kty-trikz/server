mapcyclefile "mapcycle.txt"

// Networking
sv_downloadurl "https://raw.githubusercontent.com/kty-trikz/fastdl/refs/heads/main/cstrike"
sv_allowdownload 1
sv_allowupload 0
net_maxfilesize 64

// Tickrate
sv_minupdaterate 100
sv_maxupdaterate 100
sv_mincmdrate 100
sv_maxcmdrate 100
sv_minrate 3500
sv_maxrate 1048576

// Interpolation
sv_client_min_interp_ratio -1
sv_client_max_interp_ratio -1

// General
sv_accelerate 5
sv_airaccelerate 1000
sv_enablebunnyhopping 1
sv_autobunnyhopping 1
sv_maxvelocity 3500
sv_alltalk 1
mp_ignore_round_win_conditions 0
mp_maxrounds 0
mp_winlimit 0
mp_timelimit 0
mp_freezetime 0
mp_roundtime 3
mp_round_restart_delay 0
mp_autokick 0
mp_spawnprotectiontime 0
mp_teams_unbalance_limit 0
mp_limitteams 0
mp_autoteambalance 0
mp_buytime 1440

// Bots
bot_stop 1
bot_allow_grenades 0
bot_allow_machine_guns 0
bot_allow_pistols 0
bot_allow_rifles 0
bot_allow_rogues 0
bot_allow_shotguns 0
bot_allow_snipers 0
bot_allow_sub_machine_guns 0
bot_auto_vacate 0
bot_chatter "off"
bot_dont_shoot 1
bot_join_after_player 0
bot_difficulty 0
